version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-security-updates:
        dependency-type: "production"
        update-types:
          - "patch"
        applies-to: "security-updates"

  # Covers Cargo.toml dependencies and the `channel` pin in
  # rust-toolchain.toml — Dependabot bumps both automatically.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "contract"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
      cargo-security-updates:
        dependency-type: "production"
        update-types:
          - "patch"
        applies-to: "security-updates"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "infrastructure"
    groups:
      actions-security-updates:
        applies-to: "security-updates"
