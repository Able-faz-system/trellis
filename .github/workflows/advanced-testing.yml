name: Advanced Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run mutation tests weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  # Manual runs let maintainers exercise the heavy suites (property tests, gas
  # benchmarks, mutation tests, CLI matrix, coverage) on demand — for example
  # before a release freeze or when chasing a flaky test — without pushing a
  # throwaway commit.
  workflow_dispatch:
    inputs:
      proptest_cases:
        description: 'Number of property-test cases per property.'
        required: false
        default: '8192'
        type: string
      run_mutation_tests:
        description: 'Also run the slower mutation-testing suite.'
        required: false
        default: false
        type: boolean

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Run property tests (${{ inputs.proptest_cases || 8192 }} cases)
        working-directory: contracts/trellis_core
        run: PROPTEST_CASES=${{ inputs.proptest_cases || 8192 }} cargo test test_properties
        env:
          RUST_LOG: debug

  gas-benchmarks:
    name: Gas Cost Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Run gas benchmarks
        working-directory: contracts/trellis_core
        run: |
          cargo bench --bench contract_bench > gas_costs.json
          cat gas_costs.json
      
      - name: Upload gas costs
        uses: actions/upload-artifact@v4
        with:
          name: gas-costs
          path: contracts/trellis_core/gas_costs.json
      
      - name: Compare with baseline (if exists)
        if: github.event_name == 'pull_request'
        run: |
          if [ -f baseline_gas_costs.json ]; then
            echo "Comparing gas costs with baseline..."
            # TODO: Implement comparison script
            # python scripts/compare_gas_costs.py baseline_gas_costs.json gas_costs.json
          else
            echo "No baseline found, skipping comparison"
          fi

  mutation-tests:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # Always run on the weekly schedule; on manual runs only when explicitly
    # requested via the `run_mutation_tests` input (the suite is slow).
    if: github.event_name == 'schedule' || inputs.run_mutation_tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      
      - name: Run mutation tests
        working-directory: contracts/trellis_core
        # `--output DIR` names the directory in which cargo-mutants creates
        # `mutants.out/`; it is not a format flag. The machine-readable
        # results live in `mutants-out/mutants.out/outcomes.json` (#610).
        #
        # cargo-mutants exits 2 when some mutants were missed and 3 when some
        # timed out. Those are expected outcomes that the score gate below
        # judges, so only other non-zero codes (usage error, baseline failure)
        # fail this step.
        run: |
          set +e
          cargo mutants --output mutants-out
          STATUS=$?
          set -e
          echo "cargo mutants exited with status $STATUS"
          case "$STATUS" in
            0|2|3) ;;
            *) echo "❌ cargo mutants failed (exit $STATUS)"; exit "$STATUS" ;;
          esac

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-results
          path: contracts/trellis_core/mutants-out/mutants.out
          if-no-files-found: error

      - name: Check mutation score
        working-directory: contracts/trellis_core
        run: |
          OUTCOMES=mutants-out/mutants.out/outcomes.json
          if [ ! -f "$OUTCOMES" ]; then
            echo "❌ $OUTCOMES not found"
            exit 1
          fi

          # Top-level counters written by cargo-mutants. Unviable mutants
          # (ones that do not compile) are excluded from the score; timeouts
          # count as detected since the mutation changed observable behaviour.
          CAUGHT=$(jq '.caught // 0' "$OUTCOMES")
          MISSED=$(jq '.missed // 0' "$OUTCOMES")
          TIMEOUT=$(jq '.timeout // 0' "$OUTCOMES")
          UNVIABLE=$(jq '.unviable // 0' "$OUTCOMES")
          DETECTED=$((CAUGHT + TIMEOUT))
          TOTAL=$((CAUGHT + MISSED + TIMEOUT))

          echo "caught=$CAUGHT missed=$MISSED timeout=$TIMEOUT unviable=$UNVIABLE"

          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ No viable mutants were tested; cannot compute a mutation score"
            exit 1
          fi

          SCORE=$((DETECTED * 100 / TOTAL))
          echo "Mutation Score: $SCORE% ($DETECTED/$TOTAL detected)"
          echo "### Mutation score: $SCORE% ($DETECTED/$TOTAL detected, $MISSED missed)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCORE" -lt 80 ]; then
            echo "❌ Mutation score below 80% threshold"
            echo "Missed mutants:"
            cat mutants-out/mutants.out/missed.txt 2>/dev/null || true
            exit 1
          else
            echo "✅ Mutation score meets 80% threshold"
          fi

  cli-integration-tests:
    name: CLI Integration Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Make mock executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x cli/trellis_cli/tests/mock_stellar.sh
      
      - name: Run CLI integration tests
        working-directory: cli/trellis_cli
        run: cargo test --test cli_integration
        env:
          RUST_LOG: debug

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      
      - name: Generate coverage report
        working-directory: contracts/trellis_core
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/trellis_core/lcov.info
          flags: contract-tests
          name: contract-coverage

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [property-tests, gas-benchmarks, cli-integration-tests]
    if: always()
    steps:
      - name: Check all tests passed
        run: |
          if [[ "${{ needs.property-tests.result }}" != "success" ]] || \
             [[ "${{ needs.gas-benchmarks.result }}" != "success" ]] || \
             [[ "${{ needs.cli-integration-tests.result }}" != "success" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
