name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # Allow maintainers to re-run the suite without pushing a commit.
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete — cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing Node version in one run instead of stopping at
      # the first, so a version-specific break is obvious immediately.
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` over `npm install`: installs exactly the lockfile and fails
      # loudly if package.json and package-lock.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Vite inlines these at build time; without them the uploaded bundle
      # throws on first config access.
      - name: Build
        run: npm run build
        env:
          VITE_CONTRACT_ID: CAUAO7CYKULE2K4EJMQ6LLRUHP7Y7JYOH6G2VBXKYG7PTETE3UZ3DU7Q
          VITE_RPC_URL: https://soroban-testnet.stellar.org
          VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

      - name: Verify env vars were inlined into the bundle
        # Match the inlined env object key, not the raw value — config.ts's
        # dev fallbacks contain the same values and would mask a missing var.
        run: |
          for var in VITE_CONTRACT_ID VITE_RPC_URL VITE_NETWORK_PASSPHRASE; do
            grep -rqE "${var}:[\`\"'][^\`\"']+" dist/assets/ \
              || { echo "::error::${var} was not inlined into the build"; exit 1; }
          done

      # Uploaded from a single Node version — the artifact is for inspecting a
      # failed build, not for release, so two copies add nothing.
      - name: Upload production build
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: E2E (full user journey against local devnet)
    # Manual-trigger only (#143): needs a Docker-backed local Soroban devnet
    # and a real browser, both much heavier than the rest of this workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install stellar CLI
        run: |
          curl -sL -o stellar-cli.tar.gz https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli.tar.gz
          sudo mv stellar /usr/local/bin/stellar
          stellar --version

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run E2E suite
        run: bash tests/e2e/run.sh
        working-directory: .

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
