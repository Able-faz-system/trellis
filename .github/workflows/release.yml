name: Release

# Pushing a `v*` tag (e.g. `v0.2.0`, `v0.2.0-test`) cuts a draft GitHub Release:
# changelog from conventional commits, plus the compiled contract WASM and CLI
# binaries attached as artifacts. The committed CHANGELOG.md is regenerated and
# pushed back to the default branch so release history stays browsable without
# cutting a release. Version bumps to Cargo.toml happen before the tag is
# pushed (that's what's being released), not inside this workflow.
on:
  push:
    tags:
      - 'v*'
  # Manual runs let maintainers rehearse the release pipeline (changelog, WASM
  # and CLI builds, version checks) against an arbitrary commit before tagging.
  # `version` must match the Cargo.toml/package.json versions on that commit so
  # `verify-version` still guards the build; `dry_run` defaults to true and
  # suppresses the draft GitHub Release, so a rehearsal never publishes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release without the leading "v" (e.g. 0.2.0); must match Cargo.toml/package.json.'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only — do not create the draft GitHub Release.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    # Pushes the regenerated CHANGELOG.md back to the default branch.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version from tag or manual input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Release notes for this specific tag — attached to the GitHub Release.
      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

      # Committed changelog — full release history, kept in the repository so
      # it can be read without cutting a release or browsing tags.
      - name: Regenerate committed CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit updated CHANGELOG.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(release): update CHANGELOG.md for ${GITHUB_REF_NAME}"
          # Replay the changelog commit on top of the latest default branch so
          # the push stays a fast-forward if the branch moved while we ran.
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

  verify-version:
    name: Verify release version matches Cargo.toml/package.json versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compare release version with Cargo.toml/package.json
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSION:-}" ]; then
            TAG_VERSION="$REQUESTED_VERSION"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          CLI_VERSION=$(grep -m1 '^version' cli/trellis_cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          CONTRACT_VERSION=$(grep -m1 '^version' contracts/trellis_core/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")

          echo "Release version:  $TAG_VERSION"
          echo "CLI version:      $CLI_VERSION"
          echo "Contract version: $CONTRACT_VERSION"
          echo "Frontend version: $FRONTEND_VERSION"

          MISMATCH=0
          [ "$TAG_VERSION" = "$CLI_VERSION" ] || { echo "::error::Release version ($TAG_VERSION) does not match cli/trellis_cli/Cargo.toml version ($CLI_VERSION)"; MISMATCH=1; }
          [ "$TAG_VERSION" = "$CONTRACT_VERSION" ] || { echo "::error::Release version ($TAG_VERSION) does not match contracts/trellis_core/Cargo.toml version ($CONTRACT_VERSION)"; MISMATCH=1; }
          [ "$TAG_VERSION" = "$FRONTEND_VERSION" ] || { echo "::error::Release version ($TAG_VERSION) does not match frontend/package.json version ($FRONTEND_VERSION)"; MISMATCH=1; }

          if [ "$MISMATCH" -eq 1 ]; then
            echo "::error::Version mismatch between the release version and Cargo.toml/package.json. Bump the versions before tagging."
            exit 1
          fi

  # Same gate as contract-ci.yml's `verify` job: a release must never ship
  # binaries built from a commit whose fmt/clippy/test checks fail.
  verify:
    name: Test, clippy & fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # rust-toolchain.toml pins the compiler, rustfmt and clippy.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  build-contract:
    name: Build contract WASM
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Fail release builds if Cargo.lock is not consistent with Cargo.toml.
      - name: Verify Cargo.lock is up-to-date
        run: |
          set -euo pipefail
          echo "::group::Cargo.lock verification"
          cargo check --locked --workspace
          echo "::endgroup::"

      - name: Build trellis_core WASM
        # `cargo rustc` targeting wasm32-unknown-unknown, not `stellar contract
        # build` (wasm32v1-none) — see DEPLOYMENT.md for why.
        run: |
          cargo rustc \
            --frozen \
            --manifest-path=contracts/trellis_core/Cargo.toml \
            --crate-type=cdylib \
            --target=wasm32-unknown-unknown \
            --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: trellis_core-wasm
          path: target/wasm32-unknown-unknown/release/trellis_core.wasm

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: trellis
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: trellis
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: trellis.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed per target so the OS matrix legs never share a cache.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build trellis CLI
        run: cargo build --frozen --release --manifest-path=cli/trellis_cli/Cargo.toml --target=${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/trellis-${{ matrix.target }}${{ matrix.bin == 'trellis.exe' && '.exe' || '' }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: trellis-cli-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    # `dry_run` defaults to true for manual runs, so a rehearsal stops after the
    # builds and version check. Tag pushes are unaffected: `inputs.dry_run` is
    # empty there, so the first clause is true.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
    needs: [changelog, verify, build-contract, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          find artifacts/trellis_core-wasm artifacts/trellis-cli-* -type f -print0 |
            while IFS= read -r -d '' f; do
              sha256sum "$f" | sed "s|$(dirname "$f")/||" > "$f.sha256"
            done

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign artifacts and checksums
        run: |
          set -euo pipefail
          find artifacts/trellis_core-wasm artifacts/trellis-cli-* -type f ! -name '*.asc' -print0 |
            while IFS= read -r -d '' f; do
              gpg --batch --yes --detach-sign --armor -o "$f.asc" "$f"
            done

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.changelog.outputs.version }}
          body_path: artifacts/changelog/CHANGELOG.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/trellis_core-wasm/*
            artifacts/trellis-cli-x86_64-unknown-linux-gnu/*
            artifacts/trellis-cli-x86_64-apple-darwin/*
            artifacts/trellis-cli-x86_64-pc-windows-msvc/*
