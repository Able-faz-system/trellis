[package]
name = "trellis_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# `cdylib` is the artifact that gets deployed to Soroban; `rlib` lets the
# in-crate `[[bench]]` target `use trellis_core::…` the same way an external
# consumer does (without it `cargo clippy --all-targets` fails to link the
# bench). Both are emitted, so `make build-contract` still produces
# `trellis_core.wasm`.
[lib]
crate-type = ["cdylib", "rlib"]

# soroban-sdk 22.x only — the on-chain ABI (env interface version) is tied to
# the major version, and each minor/patch is expected to stay
# backwards-compatible within it. The explicit upper bound keeps a future
# major bump (23) from being pulled in silently; Cargo.lock (committed) pins
# the exact resolved version for reproducible builds across environments.
# Deploying the compiled WASM requires a `stellar` CLI build that supports the
# soroban-sdk 22.x host environment — see DEPLOYMENT.md's Prerequisites for
# the version this repo has been verified against.
#
# COUPLING: cli/trellis_cli/build.rs reads the soroban-sdk requirement below
# (the [dependencies] entry) and embeds it in `trellis --version`. Keep it on a
# single line; the CLI build fails if the entry cannot be found.
#
# No `alloc` feature: the contract only uses the SDK's host-object-backed
# `Vec` / `Map` / `String` / `BytesN`, which need no guest-side allocator.
# Removing it was verified against the full build + test suite, and it made
# no difference to the release WASM size (#466). Re-add it only if guest
# heap types (`alloc::vec::Vec`, `alloc::string::String`, …) are introduced.
[dependencies]
soroban-sdk = { version = ">=22.0.0, <23" }

[dev-dependencies]
soroban-sdk = { version = ">=22.0.0, <23", features = ["testutils"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }

[[bench]]
name = "contract_bench"
harness = false
