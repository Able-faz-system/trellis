[package]
name = "trellis_cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "trellis"
path = "src/main.rs"

# Only the dependencies actually imported by the crate are declared here.
#
# Contract invokes still shell out to the `stellar` binary (see
# `src/rpc.rs`). Read-only Soroban JSON-RPC methods that need no signing or
# XDR (`getHealth`, `getLatestLedger`) are called natively over HTTP with
# `reqwest`'s blocking client, which drives its own internal runtime — so no
# direct `tokio` dependency is needed. Only rustls is enabled, keeping the
# build free of a system OpenSSL requirement.
[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dotenvy = "0.15"
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
url = "2"
base64 = "0.21"
unicode-normalization = "0.1"
governor = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

stellar-xdr = "22.1"
stellar-strkey = "0.0.9"

[dev-dependencies]
# Local HTTP server for asserting native JSON-RPC request shape / response
# parsing without touching a real network.
mockito = "1"
